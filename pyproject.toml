[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardscan"
version = "0.1.0"
description = "Local network business-card archive MVP"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.1,<5.3",
  "psycopg[binary]>=3.2",
  "celery>=5.4",
  "redis>=5.0",
  "Pillow>=10.4",
  "python-dotenv>=1.0",
  "langdetect>=1.0.9",
  "Unidecode>=1.3.8",
  "pytesseract>=0.3.13",
  "django-htmx>=1.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.9",
  "factory-boy>=3.3",
  "ruff>=0.7",
  "black>=24.8",
  "mypy>=1.11",
  "django-stubs>=5.1",
  "playwright>=1.47",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

'target-version' = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["app"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
