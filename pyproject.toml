[project]
name = "cardscan"
version = "0.1.0"
description = "Local-network business card archive MVP"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.0,<6.0",
  "psycopg[binary]>=3.1",
  "celery>=5.4",
  "redis>=5.0",
  "Pillow>=10.0",
  "python-dotenv>=1.0",
  "Unidecode>=1.3",
  "langdetect>=1.0.9",
  "django-htmx>=1.19",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.8",
  "factory-boy>=3.3",
  "ruff>=0.5",
  "black>=24.0",
  "mypy>=1.10",
  "playwright>=1.45",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["app"]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
plugins = []
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
