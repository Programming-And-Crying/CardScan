services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cardscan}
      POSTGRES_USER: ${POSTGRES_USER:-cardscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardscan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    working_dir: /app/app
    env_file:
      - .env
    volumes:
      - .:/app
      - media_data:/app/app/media
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  worker:
    build: .
    command: celery -A config worker -l info
    working_dir: /app/app
    env_file:
      - .env
    volumes:
      - .:/app
      - media_data:/app/app/media
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.27
    volumes:
      - ./ops/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_data:/app/media
    ports:
      - "8080:80"
    depends_on:
      - web

volumes:
  postgres_data:
  media_data:
