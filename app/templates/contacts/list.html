{% extends "base/layout.html" %}
{% block content %}
<h1>Contacts</h1>
<a href="/contacts/create/">Create contact</a>
<ul>
  {% for contact in contacts %}
  <li><a href="/contacts/{{ contact.id }}/">{{ contact.full_name }}</a></li>
  {% empty %}
  <li>No contacts found</li>
  {% endfor %}
</ul>
{% endblock %}
